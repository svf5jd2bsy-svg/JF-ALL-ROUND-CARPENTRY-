name: Deploy JF LIFE Library to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "::error title=GitHub Pages not enabled::Pages must be enabled once manually. Go to Settings > Pages > Build and deployment and set Source to 'GitHub Actions', then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the public app shell
        shell: bash
        run: |
          assets=(
            index.html
            App/Library-Index.html
            App/manifest.webmanifest
            App/sw.js
            App/icons/apple-touch-icon.png
            App/icons/icon-192.png
            App/icons/icon-512.png
          )
          for asset in "${assets[@]}"; do
            install -D -m 644 "$asset" "_site/$asset"
          done

          # The Windows library manifest and its files may contain private data.
          mkdir -p _site/Organisation/latest
          cat > _site/Organisation/latest/File-Library-Manifest.json <<'JSON'
          {
            "output_root": "Library",
            "sources": [],
            "files": [],
            "skipped": []
          }
          JSON
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
