name: Validate JF LIFE mobile app

on:
  push:
    branches: [main]
    paths:
      - "mobile/jf-life-mobile/**"
  pull_request:
    paths:
      - "mobile/jf-life-mobile/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/jf-life-mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile/jf-life-mobile
        run: npm ci --ignore-scripts
      - name: Typecheck
        working-directory: mobile/jf-life-mobile
        run: npm run typecheck
